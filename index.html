<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>HR Events V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d4e46; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Toast animation classes */
        .toast-enter { transform: translateY(-100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .toast-exit { opacity: 1; }
        .toast-exit-active { opacity: 0; transition: all 0.3s ease-out; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0d4e46',
                        light: '#146459',
                        mint: '#7be4af',
                        minthover: '#66d19c'
                    },
                    borderRadius: {
                        '4xl': '2rem'
                    }
                }
            }
        }
    </script>
</head>
<body class="text-gray-800 antialiased overflow-hidden h-[100dvh] flex flex-col relative">
    
    <div id="toast-container" class="fixed top-4 right-4 left-4 md:left-auto md:w-80 z-[100] flex flex-col gap-2 pointer-events-none"></div>
    
    <div id="app" class="h-full w-full"></div>

    <!-- Modals Containers -->
    <div id="modal-container" class="relative z-[60]"></div>

    <script>
        const STORAGE_KEY = 'hr_v2_data';
        const SESSION_KEY = 'hr_v2_session';

        const appState = {
            currentUser: null,
            currentView: 'login', // login, dashboard, workers, profile, ranking
            viewParams: {},
            selectedMonth: getCurrentMonthStr(),
            data: {
                workers: [],
                points: [],
                documents: []
            },
            formSpecialties: []
        };

        const specialtiesList = ["Animador", "Recreacionista", "Personajes", "DJ", "Fotografía", "Video", "Logística", "Montaje", "Coordinación", "Pintucaritas"];

        // Utilities
        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function getCurrentMonthStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 15);
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-3 rounded-xl text-white font-bold text-sm shadow-lg flex items-center gap-2 toast-enter ${type === 'success' ? 'bg-mint text-dark' : 'bg-red-500'}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i> ${msg}`;
            container.appendChild(toast);
            if(window.lucide) window.lucide.createIcons({root: toast});
            
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });
            
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-exit', 'toast-exit-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast('Copiado al portapapeles'));
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('Copiado al portapapeles');
                } catch (err) {
                    showToast('Error al copiar', 'error');
                }
                document.body.removeChild(textArea);
            }
        }

        function loadData() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                appState.data = JSON.parse(raw);
            }
            
            // Auto-seed Admin if missing
            if (!appState.data.workers.some(w => w.role === 'ADMIN')) {
                appState.data.workers.push({
                    id: 'admin_master',
                    name: 'Administrador Principal',
                    idNumber: '123456',
                    role: 'ADMIN',
                    status: 'active',
                    phone: '3000000000',
                    email: '',
                    city: 'Central',
                    address: '',
                    emergencyContact: '',
                    emergencyPhone: '',
                    jobRole: 'Director',
                    specialties: [],
                    availabilityText: 'Siempre disponible',
                    bank: { bankName: '', type: '', number: '', owner: '' },
                    photo: '',
                    joinDate: getTodayStr()
                });
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.data));
        }

        function loadSession() {
            const raw = sessionStorage.getItem(SESSION_KEY);
            if (raw) {
                const session = JSON.parse(raw);
                const user = appState.data.workers.find(w => w.id === session.id);
                if (user) {
                    appState.currentUser = user;
                    
                    // Restrict worker navigation on reload
                    if (user.role === 'WORKER') {
                        appState.currentView = 'profile';
                        appState.viewParams = { workerId: user.id, activeTab: 'rendimiento' };
                    } else {
                        appState.currentView = 'dashboard';
                    }
                }
            }
        }

        window.login = (e) => {
            e.preventDefault();
            const cedula = document.getElementById('l-cedula').value.trim();
            if (!cedula) return showToast('Ingresa tu cédula', 'error');

            const user = appState.data.workers.find(w => w.idNumber === cedula);
            if (!user) {
                return showToast('Credenciales incorrectas o usuario no encontrado', 'error');
            }
            if (user.status !== 'active') {
                return showToast('Usuario inactivo. Contacta a administración.', 'error');
            }

            appState.currentUser = user;
            sessionStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id }));
            
            if (user.role === 'WORKER') {
                setView('profile', { workerId: user.id, activeTab: 'rendimiento' });
            } else {
                setView('dashboard');
            }
            showToast(`Bienvenido, ${user.name.split(' ')[0]}`);
        };

        window.logout = () => {
            appState.currentUser = null;
            sessionStorage.removeItem(SESSION_KEY);
            setView('login');
        };

        window.setView = (view, params = {}) => {
            // Strict Worker Guard
            if (appState.currentUser?.role === 'WORKER' && view !== 'profile' && view !== 'login') {
                view = 'profile';
                params = { workerId: appState.currentUser.id, activeTab: 'rendimiento' };
            }

            appState.currentView = view;
            appState.viewParams = params;
            renderApp();
        };

        function renderLogin() {
            return `
                <div class="min-h-full bg-dark flex flex-col items-center justify-center p-6 animate-in fade-in zoom-in duration-300">
                    <div class="w-20 h-20 bg-mint rounded-3xl flex items-center justify-center text-dark mb-8 shadow-[0_0_40px_rgba(123,228,175,0.3)]">
                        <i data-lucide="briefcase" class="w-10 h-10"></i>
                    </div>
                    <h1 class="text-4xl font-black text-white mb-2 tracking-tight text-center">HR Events</h1>
                    <p class="text-mint font-medium mb-10 text-center max-w-sm">Sistema centralizado de talento y rendimiento.</p>
                    
                    <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-xl">
                        <h2 class="text-xl font-bold text-gray-800 mb-6 text-center">Iniciar Sesión</h2>
                        <form onsubmit="window.login(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Cédula o Documento</label>
                                <div class="relative">
                                    <i data-lucide="user" class="absolute left-4 top-3.5 text-gray-400 w-5 h-5"></i>
                                    <input type="text" id="l-cedula" class="w-full border border-gray-200 rounded-2xl py-3 pl-12 pr-4 focus:outline-none focus:border-mint focus:ring-2 focus:ring-mint/20" placeholder="Ej. 123456" required>
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-mint text-dark font-bold rounded-2xl py-3.5 hover:bg-minthover transition-colors shadow-lg">Ingresar al Sistema</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderLayout(contentHTML) {
            const u = appState.currentUser;
            const isWorker = u.role === 'WORKER';

            const navItems = [
                { id: 'dashboard', icon: 'layout-dashboard', label: 'Inicio', roles: ['ADMIN', 'HR', 'COORD'] },
                { id: 'workers', icon: 'users', label: 'Equipo', roles: ['ADMIN', 'HR', 'COORD'] },
                { id: 'ranking', icon: 'star', label: 'Ranking', roles: ['ADMIN', 'HR', 'COORD'] }
            ].filter(i => i.roles.includes(u.role));

            return `
                <div class="flex h-full w-full bg-dark overflow-hidden">
                    <!-- SIDEBAR (PC) -->
                    <div class="hidden md:flex flex-col w-72 bg-dark text-white pt-8 pb-6 px-6 border-r border-light relative z-20">
                        <div class="mb-10 flex items-center gap-3">
                            <div class="w-10 h-10 bg-mint rounded-xl flex items-center justify-center text-dark shrink-0">
                                <i data-lucide="briefcase" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-black tracking-tight leading-tight">HR Events</h2>
                                <p class="text-[10px] text-mint uppercase font-bold tracking-widest">Portal V2</p>
                            </div>
                        </div>

                        <nav class="flex-1 space-y-2">
                            ${isWorker 
                                ? `<button onclick="window.setView('profile', {workerId: '${u.id}', activeTab: 'rendimiento'})" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-bold transition-all bg-mint text-dark shadow-lg shadow-mint/20"><i data-lucide="user" class="w-5 h-5"></i> Mi Perfil</button>`
                                : navItems.map(item => `
                                    <button onclick="window.setView('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl font-bold transition-all ${appState.currentView === item.id || (item.id === 'workers' && appState.currentView === 'profile') ? 'bg-mint text-dark shadow-lg shadow-mint/20' : 'text-gray-300 hover:bg-light hover:text-white'}">
                                        <i data-lucide="${item.icon}" class="w-5 h-5"></i> ${item.label}
                                    </button>
                                `).join('')
                            }
                        </nav>

                        <div class="mt-auto bg-light p-4 rounded-3xl border border-light/50">
                            <div class="flex items-center gap-3 mb-3">
                                ${u.photo 
                                    ? `<img src="${u.photo}" class="w-10 h-10 rounded-full object-cover shrink-0">`
                                    : `<div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-dark font-bold shrink-0">${u.name.substring(0,2).toUpperCase()}</div>`
                                }
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-bold truncate">${u.name}</p>
                                    <p class="text-[10px] text-mint font-black uppercase tracking-wider">${u.role}</p>
                                </div>
                            </div>
                            <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 text-xs font-bold text-gray-300 hover:text-white bg-dark py-2 rounded-xl transition-colors">
                                <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
                            </button>
                        </div>
                    </div>

                    <!-- MAIN CONTENT -->
                    <div class="flex-1 flex flex-col h-full bg-[#f8fafc] md:rounded-l-[2.5rem] overflow-hidden relative shadow-2xl md:border-l-8 border-mint/20">
                        <!-- Topbar PC -->
                        <div class="hidden md:flex h-20 items-center justify-end px-8 bg-white border-b border-gray-100 shrink-0">
                            <div class="flex items-center gap-2 text-gray-500 bg-gray-50 px-4 py-2 rounded-full border border-gray-100 font-medium text-sm">
                                <i data-lucide="calendar" class="w-4 h-4"></i> ${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}
                            </div>
                        </div>

                        <!-- Dynamic Content Area -->
                        <div class="flex-1 overflow-y-auto p-6 md:p-8 relative hide-scrollbar pb-24 md:pb-8">
                            ${contentHTML}
                        </div>

                        <!-- BOTTOM NAV (Mobile) -->
                        <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-3 rounded-t-4xl shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-50">
                            <div class="flex justify-around items-center max-w-md mx-auto">
                                ${isWorker 
                                    ? `
                                        <button onclick="window.setView('profile', {workerId: '${u.id}', activeTab: 'rendimiento'})" class="flex flex-col items-center gap-1 transition-colors text-dark">
                                            <div class="p-2.5 rounded-2xl bg-mint/20 text-dark"><i data-lucide="user" class="w-6 h-6 stroke-[2.5px]"></i></div>
                                            <span class="text-[10px] font-bold">Mi Perfil</span>
                                        </button>
                                        <button onclick="window.logout()" class="flex flex-col items-center gap-1 transition-colors text-gray-400 hover:text-red-500">
                                            <div class="p-2.5 rounded-2xl"><i data-lucide="log-out" class="w-6 h-6 stroke-2"></i></div>
                                            <span class="text-[10px] font-bold">Salir</span>
                                        </button>
                                    `
                                    : navItems.map(item => `
                                        <button onclick="window.setView('${item.id}')" class="flex flex-col items-center gap-1 transition-colors ${appState.currentView === item.id || (item.id === 'workers' && appState.currentView === 'profile') ? 'text-dark' : 'text-gray-400'}">
                                            <div class="p-2.5 rounded-2xl transition-all ${appState.currentView === item.id || (item.id === 'workers' && appState.currentView === 'profile') ? 'bg-mint/20 text-dark' : ''}">
                                                <i data-lucide="${item.icon}" class="w-6 h-6 ${appState.currentView === item.id || (item.id === 'workers' && appState.currentView === 'profile') ? 'stroke-[2.5px]' : 'stroke-2'}"></i>
                                            </div>
                                            <span class="text-[10px] font-bold">${item.label}</span>
                                        </button>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            const activeWorkers = appState.data.workers.filter(w => w.status === 'active').length;
            
            // Calculate avg points for current month
            const monthlyPoints = appState.data.points.filter(p => p.month === appState.selectedMonth);
            const scores = {};
            monthlyPoints.forEach(p => {
                scores[p.workerId] = (scores[p.workerId] || 0) + (p.type === 'positive' ? Number(p.points) : -Number(p.points));
            });
            const avgPoints = Object.keys(scores).length > 0 ? Math.round(Object.values(scores).reduce((a,b)=>a+b,0) / Object.keys(scores).length) : 0;
            
            // Top worker
            const topWorkerId = Object.keys(scores).sort((a,b) => scores[b] - scores[a])[0];
            const topWorker = topWorkerId ? appState.data.workers.find(w => w.id === topWorkerId) : null;

            return `
                <div class="space-y-6 animate-in fade-in duration-300">
                    <div class="bg-dark md:bg-transparent -mx-6 -mt-6 p-8 md:p-0 md:mx-0 md:mt-0 text-white md:text-dark md:mb-6 rounded-b-4xl md:rounded-none">
                        <h1 class="text-3xl font-black mb-1">Hola, ${appState.currentUser.name.split(' ')[0]}</h1>
                        <p class="text-mint md:text-gray-500 font-medium">Resumen administrativo general</p>
                        
                        <div class="flex justify-between items-end mt-8 border-b border-light md:border-gray-200 pb-6">
                            <div class="text-center">
                                <p class="text-5xl font-black text-mint md:text-dark mb-1">${activeWorkers}</p>
                                <p class="text-xs text-gray-300 md:text-gray-500 font-medium uppercase tracking-wider">Activos</p>
                            </div>
                            <div class="text-center">
                                <p class="text-5xl font-black text-white md:text-mint mb-1">${avgPoints}</p>
                                <p class="text-xs text-gray-300 md:text-gray-500 font-medium uppercase tracking-wider">Prom. Puntos</p>
                            </div>
                            <div class="text-center">
                                <p class="text-5xl font-black text-mint md:text-dark mb-1">${appState.data.documents.length}</p>
                                <p class="text-xs text-gray-300 md:text-gray-500 font-medium uppercase tracking-wider">Docs.</p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div onclick="window.setView('workers')" class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-4 cursor-pointer hover:border-mint transition-colors">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="users" class="w-6 h-6"></i></div>
                            <div><h3 class="font-bold text-gray-800">Directorio de Equipo</h3><p class="text-sm text-gray-500">Gestionar trabajadores</p></div>
                        </div>
                        <div onclick="window.setView('ranking')" class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex items-center gap-4 cursor-pointer hover:border-mint transition-colors">
                            <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center shrink-0"><i data-lucide="star" class="w-6 h-6"></i></div>
                            <div><h3 class="font-bold text-gray-800">Ranking y Rendimiento</h3><p class="text-sm text-gray-500">Evaluaciones mensuales</p></div>
                        </div>
                    </div>

                    ${topWorker ? `
                        <div>
                            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-mint"></i> Destacado del Mes</h2>
                            <div class="bg-gradient-to-r from-dark to-light p-6 rounded-3xl text-white flex items-center gap-6 shadow-xl">
                                <div class="relative">
                                    ${topWorker.photo ? `<img src="${topWorker.photo}" class="w-20 h-20 rounded-full object-cover border-4 border-white/20">` : `<div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center text-2xl font-black border-4 border-white/20">${topWorker.name.substring(0,2).toUpperCase()}</div>`}
                                    <div class="absolute -bottom-2 -right-2 bg-yellow-400 text-yellow-900 p-1.5 rounded-full shadow-lg border-2 border-white"><i data-lucide="award" class="w-4 h-4"></i></div>
                                </div>
                                <div class="flex-1">
                                    <p class="text-mint font-black text-xs uppercase tracking-widest mb-1">Líder en Puntos</p>
                                    <h3 class="text-2xl font-bold truncate">${topWorker.name}</h3>
                                    <p class="opacity-80 text-sm mt-1">${topWorker.role} • ${scores[topWorker.id]} pts</p>
                                </div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderWorkers() {
            const canEdit = ['ADMIN', 'HR'].includes(appState.currentUser.role);
            const workersList = appState.data.workers.map(w => `
                <div onclick="window.setView('profile', {workerId: '${w.id}'})" class="bg-white p-5 rounded-3xl border border-gray-100 shadow-sm flex items-start gap-4 cursor-pointer hover:border-mint transition-colors">
                    ${w.photo ? `<img src="${w.photo}" class="w-14 h-14 rounded-2xl object-cover shrink-0">` : `<div class="w-14 h-14 bg-gray-100 text-gray-400 rounded-2xl flex items-center justify-center font-black text-xl shrink-0">${w.name.substring(0,2).toUpperCase()}</div>`}
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-gray-800 truncate">${w.name}</h3>
                            <span class="text-[10px] px-2 py-1 rounded-full font-bold uppercase ${w.status==='active'?'bg-green-50 text-green-600 border border-green-200':'bg-gray-100 text-gray-500'}">${w.status==='active'?'Activo':'Inactivo'}</span>
                        </div>
                        <p class="text-sm text-light font-semibold mt-0.5 truncate">${w.jobRole}</p>
                        <p class="text-xs text-gray-400 truncate mt-1">ID: ${w.idNumber} • ${w.role}</p>
                    </div>
                </div>
            `).join('');

            return `
                <div class="space-y-6 flex flex-col h-full animate-in fade-in duration-300">
                    <div class="flex justify-between items-end shrink-0">
                        <div>
                            <h1 class="text-2xl font-black text-gray-800">Directorio</h1>
                            <p class="text-gray-500 text-sm">Personal registrado.</p>
                        </div>
                        ${canEdit ? `<button onclick="window.openWorkerModal()" class="bg-mint text-dark px-4 py-2.5 rounded-2xl font-bold shadow-lg hover:bg-minthover flex items-center gap-2 text-sm"><i data-lucide="user-plus" class="w-4 h-4"></i> Nuevo</button>` : ''}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto hide-scrollbar pb-4 pr-2">
                        ${workersList || '<p class="text-gray-400 col-span-full py-10 text-center">No hay trabajadores.</p>'}
                    </div>
                </div>
            `;
        }

        function renderProfile(workerId) {
            const worker = appState.data.workers.find(w => w.id === workerId);
            if(!worker) return `<p>Error: Trabajador no encontrado</p>`;

            const u = appState.currentUser;
            const isSelf = u.id === worker.id;
            const isWorker = u.role === 'WORKER';
            const canEdit = ['ADMIN', 'HR'].includes(u.role);
            const canEvaluate = ['ADMIN', 'HR', 'COORD'].includes(u.role);
            
            const activeTab = appState.viewParams.activeTab || 'rendimiento';

            // Points logic
            const workerPoints = appState.data.points.filter(p => p.workerId === worker.id).sort((a,b) => new Date(b.date) - new Date(a.date));
            const totalPoints = workerPoints.reduce((acc, curr) => acc + (curr.type === 'positive' ? Number(curr.points) : -Number(curr.points)), 0);
            const monthPoints = workerPoints.filter(p => p.month === getCurrentMonthStr()).reduce((acc, curr) => acc + (curr.type === 'positive' ? Number(curr.points) : -Number(curr.points)), 0);

            // Documents
            const docs = appState.data.documents.filter(d => d.workerId === worker.id);

            const renderTabContent = () => {
                if(activeTab === 'rendimiento') {
                    return `
                        <div class="space-y-6 animate-in slide-in-from-right-4 duration-300">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="bg-gradient-to-r from-dark to-light p-6 rounded-3xl text-white shadow-lg flex justify-between items-center">
                                    <div>
                                        <p class="text-mint font-semibold text-xs uppercase tracking-wider mb-1">Mes Actual (${getCurrentMonthStr()})</p>
                                        <h3 class="text-4xl font-black">${monthPoints} <span class="text-lg font-medium text-gray-300">pts</span></h3>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-xs text-gray-300 uppercase tracking-wider mb-1">Histórico Total</p>

                if(activeTab === 'docs') {

                        <div class="bg-white rounded-3xl border border-gray-100 p-6 shadow-sm animate-in slide-in-from-right-4 duration-300">

                                <h3 class="font-bold text-gray-800">Repositorio</h3>
                                ${canEdit ? `
                                    <label class="bg-gray-50 border border-gray-200 text-gray-600 px-4 py-2 rounded-xl text-xs font-bold cursor-pointer hover:bg-gray-100 transition-colors flex items-center gap-2 shadow-sm">

            return `

                        ${!isWorker ? `<button onclick="window.setView('workers')" class="flex items-center gap-2 text-gray-500 hover:text-dark font-bold text-sm bg-white px-4 py-2 rounded-xl shadow-sm border border-gray-100 transition-colors"><i data-lucide="chevron-left" class="w-4 h-4"></i> Volver</button>` : `<div></div>`}

                            ${canEdit ? `<button onclick="window.openWorkerModal('${worker.id}')" class="bg-white border border-gray-200 p-2.5 rounded-xl text-gray-600 hover:text-dark shadow-sm"><i data-lucide="edit" class="w-4 h-4"></i></button>` : ''}
                            ${!isSelf ? `<a href="https://wa.me/57${worker.phone}" target="_blank" class="bg-[#25D366] text-white px-4 py-2.5 rounded-xl font-bold text-sm flex items-center gap-2 shadow-sm hover:bg-[#1ebe5d] transition-colors"><i data-lucide="message-circle" class="w-4 h-4"></i> Contactar</a>` : ''}

                        <button onclick="window.setView('profile', {workerId: '${worker.id}', activeTab: 'laboral'})" class="flex items-center gap-2 px-5 py-3 rounded-2xl font-bold text-sm transition-all whitespace-nowrap ${activeTab==='laboral'?'bg-dark text-white shadow-md':'text-gray-500 bg-white hover:bg-gray-50 border border-gray-100'}"><i data-lucide="user" class="w-4 h-4"></i> Laboral</button>
                        ${canEdit ? `<button onclick="window.setView('profile', {workerId: '${worker.id}', activeTab: 'banco'})" class="flex items-center gap-2 px-5 py-3 rounded-2xl font-bold text-sm transition-all whitespace-nowrap ${activeTab==='banco'?'bg-dark text-white shadow-md':'text-gray-500 bg-white hover:bg-gray-50 border border-gray-100'}"><i data-lucide="credit-card" class="w-4 h-4"></i> Banco</button>` : ''}

        function renderRanking() {
            const monthlyPoints = appState.data.points.filter(p => p.month === appState.selectedMonth);
            const scoresMap = {};
            appState.data.workers.filter(w=>w.status==='active').forEach(w => scoresMap[w.id] = 0);
            
            monthlyPoints.forEach(p => {
                if(scoresMap[p.workerId] !== undefined) {
                    scoresMap[p.workerId] += (p.type === 'positive' ? Number(p.points) : -Number(p.points));
                }
            });

            const ranking = Object.keys(scoresMap)
                .map(id => ({ worker: appState.data.workers.find(w => w.id === id), score: scoresMap[id] }))
                .filter(i => i.worker)
                .sort((a, b) => b.score - a.score);

            return `
                <div class="space-y-6 flex flex-col h-full animate-in fade-in duration-300">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 shrink-0">

                        <input type="month" value="${appState.selectedMonth}" onchange="window.changeMonth(event)" class="bg-white border border-gray-200 rounded-xl p-3 font-bold text-dark focus:border-mint focus:outline-none shadow-sm w-full md:w-auto">
                    </div>

                    <div class="flex-1 overflow-y-auto pr-2 space-y-3 hide-scrollbar pb-6">
                        ${ranking.length === 0 ? '<p class="text-gray-500 text-center py-10">No hay datos para este mes.</p>' : ranking.map((item, index) => `
                            <div class="bg-white p-4 rounded-3xl border ${index===0?'border-yellow-400 shadow-md':'border-gray-100'} flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center font-black shrink-0 ${index===0?'bg-yellow-400 text-yellow-900':index===1?'bg-gray-200 text-gray-600':index===2?'bg-amber-600 text-amber-100':'text-gray-400 text-xl'}">${index < 3 ? index+1 : '#'+(index+1)}</div>
                                ${item.worker.photo ? `<img src="${item.worker.photo}" class="w-12 h-12 rounded-xl object-cover shrink-0">` : `<div class="w-12 h-12 rounded-xl bg-gray-100 flex items-center justify-center font-bold text-gray-400 shrink-0">${item.worker.name.substring(0,2).toUpperCase()}</div>`}
                                <div class="flex-1 min-w-0">
                                    <h3 class="font-bold truncate text-sm md:text-base ${index===0?'text-dark':'text-gray-800'}">${item.worker.name}</h3>
                                    <p class="text-xs text-gray-500 truncate">${item.worker.jobRole}</p>
                                </div>
                                <div class="px-3 py-1.5 rounded-xl font-black shrink-0 ${index===0?'bg-yellow-50 text-yellow-700':'bg-green-50 text-green-700'}">${item.score} <span class="text-[10px] uppercase opacity-70">pts</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

                <div class="fixed inset-0 bg-dark/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">

                                        <div><label class="block text-xs font-bold text-gray-500 mb-1">Teléfono (WhatsApp)</label><input required id="w-phone" value="${w.phone||''}" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint"></div>
                                        <div><label class="block text-xs font-bold text-gray-500 mb-1">Email</label><input type="email" id="w-email" value="${w.email||''}" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint"></div>
                                        <div><label class="block text-xs font-bold text-gray-500 mb-1">Contacto Emergencia (Nombre)</label><input id="w-em-name" value="${w.emergencyContact||''}" class="w-full border border-red-200 rounded-xl p-2.5 bg-red-50 focus:bg-white focus:ring-2 focus:ring-mint"></div>

                                    </div>

                                        </div>
                                        <div><label class="block text-xs font-bold text-gray-500 mb-1">Cargo Principal</label><input id="w-job" value="${w.jobRole||''}" placeholder="Ej. Animador Senior" class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50"></div>

                                                <option value="inactive" ${w.status==='inactive'?'selected':''}>Inactivo</option>
                                            </select>
                                        </div>
                                        <div class="col-span-1 md:col-span-2">
                                            <label class="block text-xs font-bold text-gray-500 mb-2">Especialidades</label>
                                            <div class="flex flex-wrap gap-2" id="sp-container">
                                                ${specialtiesList.map(sp => `
                                                    <button type="button" onclick="window.toggleSp('${sp}')" id="sp-btn-${sp.replace(/ /g,'')}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${appState.formSpecialties.includes(sp)?'bg-light text-white':'bg-gray-100 text-gray-500'}">${sp}</button>
                                                `).join('')}
                                            </div>
                                        </div>
                                        <div class="col-span-1 md:col-span-2">
                                            <label class="block text-xs font-bold text-gray-500 mb-1 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> Días y Horarios Disponibles</label>
                                            <textarea id="w-avail-text" rows="2" placeholder="Ej: Lunes y Miércoles: Todo el día. Sábados: Tarde." class="w-full border border-gray-200 rounded-xl p-2.5 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint text-sm">${w.availabilityText||''}</textarea>

                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-purple-50 p-4 rounded-2xl border border-purple-100">
                                        <div><label class="block text-xs font-bold text-purple-800 mb-1">Banco</label><input id="w-b-name" value="${w.bank?.bankName||''}" class="w-full border-purple-200 rounded-xl p-2.5 bg-white"></div>

                                            <label class="block text-xs font-bold text-purple-800 mb-1">Tipo Cuenta</label>
                                            <select id="w-b-type" class="w-full border-purple-200 rounded-xl p-2.5 bg-white">
                                                <option value="">Seleccione...</option><option value="Ahorros" ${w.bank?.type==='Ahorros'?'selected':''}>Ahorros</option><option value="Corriente" ${w.bank?.type==='Corriente'?'selected':''}>Corriente</option>
                                            </select>
                                        </div>
                                        <div><label class="block text-xs font-bold text-purple-800 mb-1">Número</label><input id="w-b-num" value="${w.bank?.number||''}" class="w-full border-purple-200 rounded-xl p-2.5 bg-white"></div>
                                        <div><label class="block text-xs font-bold text-purple-800 mb-1">Titular y Doc.</label><input id="w-b-owner" value="${w.bank?.owner||''}" class="w-full border-purple-200 rounded-xl p-2.5 bg-white"></div>
                                    </div>
                                </div>

                                <div class="pt-4"><button type="submit" class="w-full bg-mint text-dark font-bold py-3.5 rounded-2xl hover:bg-minthover transition-colors shadow-lg">Guardar Trabajador</button></div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
            if(window.lucide) window.lucide.createIcons();
        };

        window.toggleSp = (sp) => {
            const idx = appState.formSpecialties.indexOf(sp);
            if(idx > -1) appState.formSpecialties.splice(idx, 1);
            else appState.formSpecialties.push(sp);
            
            const btn = document.getElementById(`sp-btn-${sp.replace(/ /g,'')}`);
            if(btn) {
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${idx === -1 ? 'bg-light text-white' : 'bg-gray-100 text-gray-500'}`;
            }
        };

        window.handlePhotoUpload = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 1024 * 1024) return showToast('La foto debe pesar menos de 1MB', 'error');
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('w-photo-base64').value = ev.target.result;
                document.getElementById('w-photo-preview').src = ev.target.result;
                document.getElementById('w-photo-preview').classList.remove('hidden');
                document.getElementById('w-photo-icon').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.saveWorker = (e) => {
            e.preventDefault();
            const id = document.getElementById('w-id').value;
            const data = {
                id: id || generateId(),
                photo: document.getElementById('w-photo-base64').value,
                name: document.getElementById('w-name').value,
                idNumber: document.getElementById('w-idNum').value,
                phone: document.getElementById('w-phone').value,
                email: document.getElementById('w-email').value,
                emergencyContact: document.getElementById('w-em-name').value,
                emergencyPhone: document.getElementById('w-em-phone').value,
                role: document.getElementById('w-sys-role').value,
                jobRole: document.getElementById('w-job').value,
                status: document.getElementById('w-status').value,
                specialties: appState.formSpecialties,
                availabilityText: document.getElementById('w-avail-text').value,
                bank: {
                    bankName: document.getElementById('w-b-name').value,
                    type: document.getElementById('w-b-type').value,
                    number: document.getElementById('w-b-num').value,
                    owner: document.getElementById('w-b-owner').value
                },
                joinDate: id ? appState.data.workers.find(w=>w.id===id).joinDate : getTodayStr()
            };

            if (id) {
                const idx = appState.data.workers.findIndex(w => w.id === id);
                appState.data.workers[idx] = data;
            } else {
                appState.data.workers.push(data);
            }

            saveData();
            showToast('Guardado correctamente');
            window.closeModal();
            renderApp();
        };

        window.openPointsModal = (workerId) => {
            const html = `
                <div class="fixed inset-0 bg-dark/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                    <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl overflow-hidden flex flex-col">
                        <div class="flex justify-between items-center p-5 border-b border-gray-100">
                            <h3 class="font-bold text-lg text-dark">Evaluar</h3>
                            <button onclick="window.closeModal()" class="p-1 hover:bg-gray-100 rounded-full text-gray-500"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <form onsubmit="window.savePoints(event, '${workerId}')" class="p-5 space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2">Tipo</label>
                                <select id="p-type" class="w-full border border-gray-200 rounded-xl p-3 font-bold text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint">
                                    <option value="positive">Positivo (+)</option>
                                    <option value="negative">Negativo (-)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2">Puntos</label>
                                <input type="number" id="p-val" required min="1" value="10" class="w-full border border-gray-200 rounded-xl p-3 font-black text-xl text-center bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2">Motivo Principal</label>
                                <input type="text" id="p-reason" required placeholder="Ej. Puntualidad" class="w-full border border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-2">Observación (Opccional)</label>
                                <textarea id="p-notes" rows="2" class="w-full border border-gray-200 rounded-xl p-3 text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-mint"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-dark text-mint font-bold py-3.5 rounded-2xl hover:bg-light transition-colors shadow-lg mt-2">Guardar</button>
                        </form>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = html;
            if(window.lucide) window.lucide.createIcons();
        };

        window.savePoints = (e, workerId) => {
            e.preventDefault();
            appState.data.points.push({
                id: generateId(),
                workerId: workerId,
                points: document.getElementById('p-val').value,
                type: document.getElementById('p-type').value,
                reason: document.getElementById('p-reason').value,
                notes: document.getElementById('p-notes').value,
                date: getTodayStr(),
                month: getCurrentMonthStr(),
                evaluator: appState.currentUser.name
            });
            saveData();
            showToast('Puntuación registrada');
            window.closeModal();
            renderApp();
        };

        window.closeModal = () => {
            document.getElementById('modal-container').innerHTML = '';
        };

        window.handlePdfUpload = (e, workerId) => {
            const file = e.target.files[0];
            if(!file) return;
            if(file.size > 2 * 1024 * 1024) return showToast('El PDF debe pesar menos de 2MB', 'error');
            if(file.type !== 'application/pdf') return showToast('Solo formato PDF', 'error');
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                appState.data.documents.push({
                    id: generateId(),
                    workerId: workerId,
                    name: file.name,
                    data: ev.target.result,
                    date: getTodayStr()
                });
                saveData();
                showToast('Documento subido');
                renderApp();
            };
            reader.readAsDataURL(file);
        };

        window.deleteDoc = (docId) => {
            if(confirm('¿Seguro que deseas eliminar este documento?')) {
                appState.data.documents = appState.data.documents.filter(d => d.id !== docId);
                saveData();
                showToast('Documento eliminado');
                renderApp();
            }
        };

        window.changeMonth = (e) => {
            appState.selectedMonth = e.target.value;
            renderApp();
        };

        function renderApp() {
            const appDiv = document.getElementById('app');
            
            if (appState.currentView === 'login' || !appState.currentUser) {
                appDiv.innerHTML = renderLogin();
            } else {
                let contentHTML = '';
                if(appState.currentView === 'dashboard') contentHTML = renderDashboard();
                else if(appState.currentView === 'workers') contentHTML = renderWorkers();
                else if(appState.currentView === 'profile') contentHTML = renderProfile(appState.viewParams.workerId);
                else if(appState.currentView === 'ranking') contentHTML = renderRanking();
                
                appDiv.innerHTML = renderLayout(contentHTML);
            }
            
            if(window.lucide) window.lucide.createIcons();
        }

        window.onload = () => {
            loadData();
            loadSession();
            renderApp();
        };
    </script>
</body>
</html>
