<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>HR Events - Portal Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .truncate-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="bg-[#0d4e46] text-gray-800 h-screen w-full overflow-hidden flex flex-col relative">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300">
        <div id="toast-content" class="bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-3">
            <i id="toast-icon" class="fas fa-check-circle text-[#7be4af]"></i>
            <span id="toast-message" class="font-medium text-sm">Mensaje</span>
        </div>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-view" class="absolute inset-0 z-40 flex flex-col items-center justify-center bg-[#0d4e46] p-4">
        <div class="text-center mb-8">
            <div class="bg-[#7be4af] text-[#0d4e46] w-20 h-20 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">
                <i class="fas fa-id-badge"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">HR Events</h1>
            <p class="text-[#7be4af]">Sistema centralizado de talento y rendimiento.</p>
        </div>
        <div class="glass-card w-full max-w-sm rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-center text-[#0d4e46] mb-6">Iniciar Sesión</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-600 mb-2">Cédula o Documento</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="number" id="login-doc" required placeholder="1007117953" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#146459] focus:ring-2 focus:ring-[#7be4af] transition-all bg-gray-50">
                    </div>
                </div>
                <button type="submit" id="login-btn" class="w-full bg-[#7be4af] hover:bg-[#5ac992] text-[#0d4e46] font-bold py-3 rounded-xl transition-all shadow-md">
                    Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-view" class="hidden h-full w-full flex flex-col md:flex-row bg-gray-50">
        
        <!-- NAVEGACIÓN -->
        <nav class="bg-[#146459] text-white w-full md:w-64 md:flex-shrink-0 flex md:flex-col justify-around md:justify-start p-2 md:p-6 shadow-xl z-20 order-2 md:order-1 fixed bottom-0 md:relative h-16 md:h-full">
            <div class="hidden md:block mb-10 text-center">
                <h2 class="text-2xl font-bold text-[#7be4af]">HR Events</h2>
                <p class="text-xs opacity-75 mt-1" id="user-role-display">Administrador</p>
            </div>
            
            <div class="flex md:flex-col w-full md:w-auto justify-around md:justify-start gap-1 md:gap-4 overflow-x-auto hide-scroll" id="nav-links">
                <!-- Inyectados por JS -->
            </div>

            <div class="hidden md:block mt-auto">
                <button onclick="logout()" class="w-full bg-white/10 hover:bg-white/20 text-white py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </button>
            </div>
        </nav>

        <!-- CONTENIDO -->
        <main class="flex-1 overflow-y-auto order-1 md:order-2 pb-20 md:pb-0 relative" id="main-content">
            <!-- Vistas JS -->
        </main>
    </div>

    <!-- MODAL FORMULARIO TRABAJADOR -->
    <div id="worker-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex-col justify-end md:justify-center items-center">
        <div class="bg-white w-full md:w-2/3 max-w-2xl rounded-t-3xl md:rounded-3xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-[#0d4e46] text-white md:rounded-t-3xl rounded-t-3xl">
                <h3 id="worker-modal-title" class="text-xl font-bold">Nuevo Trabajador</h3>
                <button onclick="closeWorkerModal()" class="text-white/70 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <form id="worker-form" class="space-y-6">
                    <input type="hidden" id="w-id">
                    
                    <div class="flex flex-col items-center mb-6">
                        <div class="relative w-24 h-24 rounded-full bg-gray-200 border-4 border-white shadow-lg flex items-center justify-center overflow-hidden mb-2">
                            <img id="w-photo-preview" src="" class="w-full h-full object-cover hidden">
                            <i id="w-photo-icon" class="fas fa-camera text-gray-400 text-2xl"></i>
                        </div>
                        <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 text-[#0d4e46] text-xs font-bold py-1 px-3 rounded-full transition-all">
                            Subir Foto
                            <input type="file" id="w-photo-input" accept="image/jpeg, image/png" class="hidden" onchange="handlePhotoUpload(event)">
                        </label>
                        <input type="hidden" id="w-photo-base64">
                    </div>

                    <div>
                        <h4 class="font-bold text-[#146459] border-b pb-2 mb-4">Información Personal</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="text-xs text-gray-500 font-bold">Nombre Completo</label><input type="text" id="w-name" required class="w-full p-2 border rounded-lg bg-gray-50"></div>
                            <div><label class="text-xs text-gray-500 font-bold">Documento</label><input type="number" id="w-doc" required class="w-full p-2 border rounded-lg bg-gray-50"></div>
                            <div><label class="text-xs text-gray-500 font-bold">Teléfono/WhatsApp</label><input type="number" id="w-phone" required class="w-full p-2 border rounded-lg bg-gray-50"></div>
                            <div><label class="text-xs text-gray-500 font-bold">Ciudad</label><input type="text" id="w-city" class="w-full p-2 border rounded-lg bg-gray-50"></div>
                        </div>
                    </div>

                    <div>
                        <h4 class="font-bold text-[#146459] border-b pb-2 mb-4">Información Laboral</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs text-gray-500 font-bold">Rol/Cargo</label>
                                <select id="w-role" class="w-full p-2 border rounded-lg bg-gray-50">
                                    <option value="WORKER">Trabajador</option>
                                    <option value="COORD">Coordinador</option>
                                    <option value="HR">Recursos Humanos</option>
                                    <option value="ADMIN">Administrador</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-500 font-bold">Estado</label>
                                <select id="w-status" class="w-full p-2 border rounded-lg bg-gray-50">
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                            <div class="md:col-span-2">
                                <label class="text-xs text-gray-500 font-bold">Disponibilidad Semanal (Días y Horarios)</label>
                                <input type="text" id="w-availability" placeholder="Ej: Lunes a Viernes (Tardes), Sábados todo el día" class="w-full p-2 border rounded-lg bg-gray-50">
                            </div>
                            <div class="md:col-span-2">
                                <label class="text-xs text-gray-500 font-bold">Especialidades (Ej: Animador, DJ)</label>
                                <input type="text" id="w-specs" placeholder="Separadas por coma" class="w-full p-2 border rounded-lg bg-gray-50">
                            </div>
                        </div>
                    </div>

                    <div id="bank-section-form" class="hidden">
                        <h4 class="font-bold text-[#146459] border-b pb-2 mb-4">Información Bancaria</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="text-xs text-gray-500 font-bold">Banco</label><input type="text" id="w-bank-name" class="w-full p-2 border rounded-lg bg-gray-50"></div>
                            <div>
                                <label class="text-xs text-gray-500 font-bold">Tipo de Cuenta</label>
                                <select id="w-bank-type" class="w-full p-2 border rounded-lg bg-gray-50">
                                    <option value="Ahorros">Ahorros</option>
                                    <option value="Corriente">Corriente</option>
                                    <option value="Nequi/Daviplata">Nequi / Daviplata</option>
                                </select>
                            </div>
                            <div><label class="text-xs text-gray-500 font-bold">Número de Cuenta</label><input type="number" id="w-bank-num" class="w-full p-2 border rounded-lg bg-gray-50"></div>
                            <div><label class="text-xs text-gray-500 font-bold">Titular</label><input type="text" id="w-bank-owner" class="w-full p-2 border rounded-lg bg-gray-50"></div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-4 border-t bg-gray-50 rounded-b-3xl flex justify-end gap-3">
                <button onclick="closeWorkerModal()" class="px-5 py-2 rounded-xl font-bold text-gray-500 hover:bg-gray-200 transition-all">Cancelar</button>
                <button onclick="saveWorker()" id="save-worker-btn" class="px-5 py-2 rounded-xl font-bold bg-[#7be4af] text-[#0d4e46] hover:bg-[#5ac992] shadow-md transition-all">Guardar</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & CORE JAVASCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, query, where, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4N-DtD-dPaF4r2TIU2Vsk8nlEHtEnAss",
            authDomain: "recursoslaly.firebaseapp.com",
            projectId: "recursoslaly",
            storageBucket: "recursoslaly.firebasestorage.app",
            messagingSenderId: "49889283141",
            appId: "1:49889283141:web:9cc349b9d814855f07a72c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESTADO GLOBAL
        window.appState = {
            currentUser: null,
            currentView: 'dashboard',
            selectedWorker: null,
            dbWorkers: [],
            currentProfilePoints: [],
            currentProfileDocs: []
        };

        window.onload = async () => {
            await checkSession();
        };

        async function fetchAllWorkers() {
            try {
                const querySnapshot = await getDocs(collection(db, "workers"));
                window.appState.dbWorkers = querySnapshot.docs.map(doc => doc.data());
            } catch (error) {
                console.error(error);
            }
        }

        async function checkSession() {
            try {
                const session = sessionStorage.getItem('hr_v2_session');
                if (session) {
                    window.appState.currentUser = JSON.parse(session);
                    await fetchAllWorkers(); 
                    window.showApp();
                }
            } catch(e) {}
        }

        // LOGIN Y FAILSAFE
        window.handleLogin = async (e) => {
            e.preventDefault();
            const docInput = document.getElementById('login-doc').value.trim();
            const btn = document.getElementById('login-btn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...';
            btn.disabled = true;

            try {
                if (docInput === '1007117953') {
                    const adminData = { id: 'admin_1007117953', document: '1007117953', name: 'Administrador Principal', role: 'ADMIN', status: 'activo', phone: '3000000000', photo: '', availabilityText: 'Siempre disponible' };
                    await setDoc(doc(db, "workers", "admin_1007117953"), adminData, { merge: true });
                    
                    window.appState.currentUser = adminData;
                    sessionStorage.setItem('hr_v2_session', JSON.stringify(adminData));
                    await fetchAllWorkers();
                    window.showApp();
                    return; 
                }

                const q = query(collection(db, "workers"), where("document", "==", docInput), where("status", "==", "activo"));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    window.appState.currentUser = querySnapshot.docs[0].data();
                    sessionStorage.setItem('hr_v2_session', JSON.stringify(window.appState.currentUser));
                    await fetchAllWorkers();
                    window.showApp();
                } else {
                    window.showToast('Cédula no encontrada', 'error');
                }
            } catch (error) {
                window.showToast('Error de conexión', 'error');
            } finally {
                btn.innerHTML = 'Ingresar al Sistema';
                btn.disabled = false;
            }
        };

        window.logout = () => {
            sessionStorage.removeItem('hr_v2_session');
            window.appState.currentUser = null;
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('login-doc').value = '';
        };

        // NAVEGACIÓN
        window.showApp = () => {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            
            const roleNames = { 'ADMIN': 'Administrador', 'HR': 'Recursos Humanos', 'COORD': 'Coordinador', 'WORKER': 'Trabajador' };
            document.getElementById('user-role-display').innerText = `${window.appState.currentUser.name} (${roleNames[window.appState.currentUser.role]})`;

            window.renderNav();
            
            if (window.appState.currentUser.role === 'WORKER') {
                window.appState.selectedWorker = window.appState.currentUser;
                window.setView('profile');
            } else {
                window.setView('dashboard');
            }
        };

        window.setView = async (viewName) => {
            if (window.appState.currentUser.role === 'WORKER' && viewName !== 'profile') return;
            window.appState.currentView = viewName;
            window.renderNav();
            
            const main = document.getElementById('main-content');
            
            if (viewName === 'dashboard') main.innerHTML = window.renderDashboard();
            if (viewName === 'directory') main.innerHTML = window.renderDirectory();
            if (viewName === 'profile') {
                main.innerHTML = '<div class="flex items-center justify-center h-full"><i class="fas fa-spinner fa-spin text-4xl text-[#7be4af]"></i></div>';
                await window.loadProfileData(); // Carga Puntos y Documentos de Firebase
                main.innerHTML = window.renderProfile();
                window.switchTab('rendimiento'); // Pestaña principal al abrir
            }
        };

        window.renderNav = () => {
            const role = window.appState.currentUser.role;
            const isWorker = role === 'WORKER';
            let html = '';
            const linkClass = (isActive) => `flex md:w-full items-center justify-center md:justify-start gap-2 p-3 md:py-3 md:px-4 rounded-xl transition-all cursor-pointer font-medium text-sm md:text-base ${isActive ? 'bg-[#7be4af] text-[#0d4e46] shadow-md' : 'text-white/70 hover:bg-white/10 hover:text-white'}`;

            if (!isWorker) {
                html += `<div onclick="setView('dashboard')" class="${linkClass(window.appState.currentView === 'dashboard')}"><i class="fas fa-home"></i><span class="hidden md:inline">Inicio</span></div>`;
                html += `<div onclick="setView('directory')" class="${linkClass(window.appState.currentView === 'directory')}"><i class="fas fa-users"></i><span class="hidden md:inline">Equipo</span></div>`;
            } else {
                html += `<div class="${linkClass(true)}"><i class="fas fa-user"></i><span class="hidden md:inline">Mi Perfil</span></div>`;
            }

            if (isWorker) {
                html += `<div onclick="logout()" class="flex md:hidden items-center justify-center gap-2 p-3 rounded-xl transition-all cursor-pointer font-medium text-sm text-red-300 hover:bg-white/10"><i class="fas fa-sign-out-alt"></i></div>`;
            }
            document.getElementById('nav-links').innerHTML = html;
        };

        // VISTAS SIMPLES
        window.renderDashboard = () => {
            const activeWorkers = window.appState.dbWorkers.filter(w => w.status === 'activo').length;
            return `
            <div class="p-6 md:p-10 max-w-6xl mx-auto">
                <h2 class="text-3xl font-bold text-[#0d4e46] mb-8">Panel Principal</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4 border-l-4 border-l-[#7be4af]">
                        <div class="w-14 h-14 rounded-2xl bg-[#7be4af]/20 text-[#146459] flex items-center justify-center text-2xl"><i class="fas fa-users"></i></div>
                        <div><p class="text-sm text-gray-500 font-bold">Activos</p><p class="text-3xl font-black text-[#0d4e46]">${activeWorkers}</p></div>
                    </div>
                </div>
            </div>`;
        };

        window.renderDirectory = () => {
            let html = `
            <div class="p-6 md:p-10 max-w-6xl mx-auto h-full flex flex-col">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <h2 class="text-3xl font-bold text-[#0d4e46]">Directorio del Equipo</h2>
                    <button onclick="openWorkerForm()" class="bg-[#7be4af] text-[#0d4e46] px-5 py-2.5 rounded-xl font-bold hover:bg-[#5ac992] shadow-md flex items-center gap-2">
                        <i class="fas fa-plus"></i> Nuevo
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            `;
            window.appState.dbWorkers.forEach(w => {
                const photo = w.photo ? `<img src="${w.photo}" class="w-16 h-16 rounded-2xl object-cover shadow-sm">` : `<div class="w-16 h-16 rounded-2xl bg-[#0d4e46] text-white flex items-center justify-center text-2xl shadow-sm"><i class="fas fa-user"></i></div>`;
                const isInactive = w.status === 'inactivo';
                html += `
                <div onclick="viewWorkerProfile('${w.id}')" class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md cursor-pointer flex items-center gap-4 ${isInactive ? 'opacity-60' : ''}">
                    ${photo}
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-800 text-lg truncate-text">${w.name}</h4>
                        <p class="text-sm text-[#146459] font-medium">${w.role} ${isInactive ? '(Inactivo)' : ''}</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300"></i>
                </div>`;
            });
            html += `</div></div>`;
            return html;
        };

        // EL PERFIL: PUNTOS Y DOCUMENTOS
        window.viewWorkerProfile = (id) => {
            window.appState.selectedWorker = window.appState.dbWorkers.find(w => w.id === id);
            window.setView('profile');
        };

        window.loadProfileData = async () => {
            const wId = window.appState.selectedWorker.id;
            try {
                // Fetch Puntos
                const qPoints = query(collection(db, "points"), where("workerId", "==", wId));
                const snapPoints = await getDocs(qPoints);
                window.appState.currentProfilePoints = snapPoints.docs.map(doc => ({dbId: doc.id, ...doc.data()})).sort((a,b) => b.timestamp - a.timestamp);
                
                // Fetch Docs
                const qDocs = query(collection(db, "documents"), where("workerId", "==", wId));
                const snapDocs = await getDocs(qDocs);
                window.appState.currentProfileDocs = snapDocs.docs.map(doc => ({dbId: doc.id, ...doc.data()})).sort((a,b) => b.timestamp - a.timestamp);
            } catch (e) {
                console.error(e);
            }
        };

        window.renderProfile = () => {
            const w = window.appState.selectedWorker;
            const role = window.appState.currentUser.role;
            const photo = w.photo ? `<img src="${w.photo}" class="w-24 h-24 rounded-3xl object-cover border-4 border-white shadow-lg">` : `<div class="w-24 h-24 rounded-3xl bg-white text-[#0d4e46] flex items-center justify-center text-4xl shadow-lg font-bold border-4 border-gray-50">${w.name.charAt(0)}</div>`;
            
            const canEdit = ['ADMIN', 'HR'].includes(role);
            const canGrade = ['ADMIN', 'HR', 'COORD'].includes(role);
            const isSelf = window.appState.currentUser.id === w.id;

            // Calcular puntos
            let totalPoints = 0;
            let pointsListHtml = '';
            window.appState.currentProfilePoints.forEach(p => {
                totalPoints += (p.type === 'pos' ? p.amount : -p.amount);
                const color = p.type === 'pos' ? 'text-green-500 bg-green-50' : 'text-red-500 bg-red-50';
                const sign = p.type === 'pos' ? '+' : '-';
                pointsListHtml += `
                    <div class="flex items-center justify-between p-3 border-b border-gray-50 last:border-0">
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${p.reason}</p>
                            <p class="text-xs text-gray-400">${new Date(p.timestamp).toLocaleDateString()} por ${p.evaluator}</p>
                        </div>
                        <span class="font-bold ${color} px-2 py-1 rounded-lg text-sm">${sign}${p.amount}</span>
                    </div>`;
            });
            if(pointsListHtml === '') pointsListHtml = '<p class="text-sm text-gray-400 italic py-4">No hay evaluaciones registradas.</p>';

            // Lista Documentos
            let docsListHtml = '';
            window.appState.currentProfileDocs.forEach(d => {
                docsListHtml += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl mb-2 border border-gray-100">
                        <div class="flex items-center gap-3 overflow-hidden flex-1 min-w-0 pr-3">
                            <i class="fas fa-file-pdf text-red-500 text-xl flex-shrink-0"></i>
                            <div class="flex-1 min-w-0 truncate">
                                <p class="font-bold text-gray-800 text-sm truncate">${d.name}</p>
                                <p class="text-xs text-gray-400">${new Date(d.timestamp).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-shrink-0">
                            <a href="${d.file}" download="${d.name}.pdf" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-[#146459] hover:bg-gray-100"><i class="fas fa-download"></i></a>
                            ${canEdit ? `<button onclick="deleteDocFile('${d.dbId}')" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center text-red-400 hover:bg-red-50"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>`;
            });
            if(docsListHtml === '') docsListHtml = '<p class="text-sm text-gray-400 italic py-2">No hay documentos subidos.</p>';

            return `
            <div class="p-4 md:p-10 max-w-4xl mx-auto">
                ${!isSelf ? `<button onclick="setView('directory')" class="mb-6 text-gray-500 hover:text-[#0d4e46] font-bold flex items-center gap-2"><i class="fas fa-arrow-left"></i> Volver</button>` : ''}
                
                <div class="bg-[#0d4e46] rounded-3xl p-6 md:p-10 shadow-xl relative overflow-hidden mb-6">
                    <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/3"></div>
                    <div class="relative z-10 flex flex-col md:flex-row items-center md:items-start gap-6 text-center md:text-left">
                        ${photo}
                        <div class="flex-1 text-white mt-2">
                            <h2 class="text-3xl font-black mb-1">${w.name}</h2>
                            <p class="text-[#7be4af] font-medium text-lg mb-3">${w.role} | C.C. ${w.document}</p>
                            ${w.availabilityText ? `<div class="inline-flex items-center gap-2 bg-black/20 px-4 py-1.5 rounded-full text-sm font-medium mt-1"><i class="fas fa-clock text-[#7be4af]"></i> Disp: ${w.availabilityText}</div>` : ''}
                        </div>
                        <div class="flex gap-3">
                            ${(!isSelf && w.phone) ? `<a href="https://wa.me/57${w.phone}" target="_blank" class="bg-[#25D366] text-white w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-lg hover:scale-105 transition-all"><i class="fab fa-whatsapp"></i></a>` : ''}
                            ${canEdit ? `<button onclick="openWorkerForm('${w.id}')" class="bg-white/20 text-white w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-lg hover:bg-white/30 transition-all"><i class="fas fa-pen"></i></button>` : ''}
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="flex border-b overflow-x-auto hide-scroll">
                        <button onclick="switchTab('rendimiento')" id="tab-btn-rendimiento" class="flex-1 min-w-[120px] py-4 font-bold text-center border-b-4 border-transparent text-gray-400">Rendimiento</button>
                        <button onclick="switchTab('laboral')" id="tab-btn-laboral" class="flex-1 min-w-[120px] py-4 font-bold text-center border-b-4 border-transparent text-gray-400">Laboral</button>
                        <button onclick="switchTab('documentos')" id="tab-btn-documentos" class="flex-1 min-w-[120px] py-4 font-bold text-center border-b-4 border-transparent text-gray-400">Documentos</button>
                        ${canEdit ? `<button onclick="switchTab('banco')" id="tab-btn-banco" class="flex-1 min-w-[120px] py-4 font-bold text-center border-b-4 border-transparent text-gray-400"><i class="fas fa-lock text-xs mr-1"></i> Banco</button>` : ''}
                    </div>
                    
                    <div class="p-6 min-h-[300px]">
                        <!-- RENDIMIENTO -->
                        <div id="tab-rendimiento" class="hidden">
                            <div class="flex items-center justify-between mb-6 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                <div><h3 class="text-xl font-black text-[#0d4e46]">Puntos Totales</h3><p class="text-xs text-gray-500">Historial acumulado</p></div>
                                <div class="text-3xl font-black ${totalPoints >= 0 ? 'text-[#146459]' : 'text-red-500'}">${totalPoints}</div>
                            </div>
                            
                            ${canGrade ? `
                            <div class="bg-white border rounded-2xl p-4 mb-6 shadow-sm">
                                <h4 class="text-sm font-bold text-gray-800 mb-3">Agregar Evaluación</h4>
                                <div class="flex gap-2 mb-3">
                                    <input type="number" id="pt-amount" placeholder="Puntos" class="w-24 p-2 border rounded-xl bg-gray-50 text-sm">
                                    <select id="pt-type" class="p-2 border rounded-xl bg-gray-50 text-sm font-bold">
                                        <option value="pos" class="text-green-600">Sumar (+)</option>
                                        <option value="neg" class="text-red-600">Restar (-)</option>
                                    </select>
                                </div>
                                <div class="flex gap-2">
                                    <input type="text" id="pt-reason" placeholder="Motivo de la evaluación..." class="flex-1 p-2 border rounded-xl bg-gray-50 text-sm">
                                    <button onclick="savePoint()" class="bg-[#0d4e46] text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-[#146459]"><i class="fas fa-check"></i></button>
                                </div>
                            </div>` : ''}
                            
                            <h4 class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-wider">Historial</h4>
                            <div class="border rounded-2xl overflow-hidden">${pointsListHtml}</div>
                        </div>

                        <!-- LABORAL -->
                        <div id="tab-laboral" class="hidden space-y-4">
                            <div><p class="text-xs text-gray-500 font-bold">Teléfono / Ciudad</p><p class="font-medium text-gray-800">${w.phone || '-'} | ${w.city || '-'}</p></div>
                            <div><p class="text-xs text-gray-500 font-bold">Especialidades</p><p class="font-medium text-[#146459]">${w.specialties || 'No registradas'}</p></div>
                            <div><p class="text-xs text-gray-500 font-bold">Días y Horarios Disponibles</p><p class="font-medium text-gray-800 bg-gray-50 p-3 rounded-xl border">${w.availabilityText || 'No especificado'}</p></div>
                        </div>

                        <!-- DOCUMENTOS -->
                        <div id="tab-documentos" class="hidden">
                            ${canEdit ? `
                            <div class="bg-[#146459]/5 border border-[#146459]/20 p-4 rounded-2xl mb-6 flex items-center justify-between gap-4">
                                <div><p class="font-bold text-[#0d4e46] text-sm">Subir Documento (PDF)</p><p class="text-xs text-gray-500">Max 1MB recomendado.</p></div>
                                <label class="bg-[#146459] text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer hover:bg-[#0d4e46] transition-all shadow-md flex-shrink-0">
                                    <i class="fas fa-upload mr-1"></i> Seleccionar
                                    <input type="file" accept="application/pdf" class="hidden" onchange="uploadDocument(event)">
                                </label>
                            </div>` : ''}
                            <h4 class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-wider">Archivos Guardados</h4>
                            <div>${docsListHtml}</div>
                        </div>

                        <!-- BANCO -->
                        ${canEdit ? `
                        <div id="tab-banco" class="hidden space-y-4">
                            <div class="bg-orange-50 text-orange-800 p-3 rounded-xl text-sm font-medium mb-4"><i class="fas fa-shield-alt mr-2"></i> Información protegida por Firestore.</div>
                            <div><p class="text-xs text-gray-500 font-bold">Banco / Tipo</p><p class="font-medium text-gray-800">${w.bankName || 'N/A'} - ${w.bankType || 'N/A'}</p></div>
                            <div>
                                <p class="text-xs text-gray-500 font-bold">Número de Cuenta</p>
                                <div class="flex items-center gap-2">
                                    <p class="font-bold text-lg text-[#0d4e46] bg-gray-50 px-3 py-1 rounded-lg border">${w.bankNumber || 'N/A'}</p>
                                    ${w.bankNumber ? `<button onclick="copyToClipboard('${w.bankNumber}')" class="bg-[#7be4af] text-[#0d4e46] w-8 h-8 rounded-lg shadow-sm hover:scale-105"><i class="fas fa-copy"></i></button>` : ''}
                                </div>
                            </div>
                            <div><p class="text-xs text-gray-500 font-bold">Titular</p><p class="font-medium text-gray-800">${w.bankOwner || 'N/A'}</p></div>
                        </div>` : ''}
                    </div>
                </div>
            </div>`;
        };

        window.switchTab = (tabId) => {
            const tabs = ['rendimiento', 'laboral', 'documentos', 'banco'];
            tabs.forEach(t => {
                const content = document.getElementById(`tab-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if(content && btn) {
                    if(t === tabId) {
                        content.classList.remove('hidden'); content.classList.add('block');
                        btn.classList.add('border-[#7be4af]', 'text-[#0d4e46]'); btn.classList.remove('border-transparent', 'text-gray-400');
                    } else {
                        content.classList.remove('block'); content.classList.add('hidden');
                        btn.classList.remove('border-[#7be4af]', 'text-[#0d4e46]'); btn.classList.add('border-transparent', 'text-gray-400');
                    }
                }
            });
        };

        // ACCIONES DE PERFIL: PUNTOS Y DOCUMENTOS
        window.savePoint = async () => {
            const amount = parseInt(document.getElementById('pt-amount').value);
            const type = document.getElementById('pt-type').value;
            const reason = document.getElementById('pt-reason').value.trim();

            if(!amount || !reason) return window.showToast('Ingresa cantidad y motivo', 'error');

            const pointData = {
                workerId: window.appState.selectedWorker.id,
                amount: amount,
                type: type,
                reason: reason,
                evaluator: window.appState.currentUser.name,
                timestamp: Date.now()
            };

            try {
                await addDoc(collection(db, "points"), pointData);
                window.showToast('Evaluación guardada');
                window.setView('profile'); // Recarga la vista para traer datos frescos
            } catch (error) {
                window.showToast('Error al guardar', 'error');
            }
        };

        window.uploadDocument = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 1.2 * 1024 * 1024) return window.showToast('El PDF no debe exceder 1MB', 'error');

            window.showToast('Subiendo documento...', 'success');
            
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result;
                const docData = {
                    workerId: window.appState.selectedWorker.id,
                    name: file.name.replace('.pdf', ''),
                    file: base64,
                    timestamp: Date.now()
                };
                
                try {
                    await addDoc(collection(db, "documents"), docData);
                    window.showToast('Documento guardado exitosamente');
                    window.setView('profile');
                } catch (error) {
                    window.showToast('Error al subir', 'error');
                }
            };
            reader.readAsDataURL(file);
        };

        window.deleteDocFile = async (dbId) => {
            if(!confirm('¿Eliminar este documento permanentemente?')) return;
            try {
                await deleteDoc(doc(db, "documents", dbId));
                window.showToast('Documento eliminado');
                window.setView('profile');
            } catch (error) {
                window.showToast('Error al eliminar', 'error');
            }
        };

        // FORMULARIO TRABAJADOR
        window.openWorkerForm = (id = null) => {
            const form = document.getElementById('worker-form');
            form.reset();
            document.getElementById('w-photo-preview').src = '';
            document.getElementById('w-photo-preview').classList.add('hidden');
            document.getElementById('w-photo-icon').classList.remove('hidden');
            document.getElementById('w-photo-base64').value = '';

            const canSeeBank = ['ADMIN', 'HR'].includes(window.appState.currentUser.role);
            document.getElementById('bank-section-form').classList.toggle('hidden', !canSeeBank);

            if (id) {
                const w = window.appState.dbWorkers.find(x => x.id === id);
                document.getElementById('worker-modal-title').innerText = 'Editar Trabajador';
                document.getElementById('w-id').value = w.id;
                document.getElementById('w-name').value = w.name;
                document.getElementById('w-doc').value = w.document;
                document.getElementById('w-phone').value = w.phone || '';
                document.getElementById('w-city').value = w.city || '';
                document.getElementById('w-role').value = w.role;
                document.getElementById('w-status').value = w.status;
                document.getElementById('w-availability').value = w.availabilityText || '';
                document.getElementById('w-specs').value = w.specialties || '';
                
                if (w.photo) {
                    document.getElementById('w-photo-base64').value = w.photo;
                    document.getElementById('w-photo-preview').src = w.photo;
                    document.getElementById('w-photo-preview').classList.remove('hidden');
                    document.getElementById('w-photo-icon').classList.add('hidden');
                }

                if (canSeeBank) {
                    document.getElementById('w-bank-name').value = w.bankName || '';
                    document.getElementById('w-bank-type').value = w.bankType || 'Ahorros';
                    document.getElementById('w-bank-num').value = w.bankNumber || '';
                    document.getElementById('w-bank-owner').value = w.bankOwner || '';
                }
            } else {
                document.getElementById('worker-modal-title').innerText = 'Nuevo Trabajador';
                document.getElementById('w-id').value = '';
            }
            document.getElementById('worker-modal').classList.remove('hidden');
            document.getElementById('worker-modal').classList.add('flex');
        };

        window.closeWorkerModal = () => {
            document.getElementById('worker-modal').classList.add('hidden');
            document.getElementById('worker-modal').classList.remove('flex');
        };

        window.handlePhotoUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 800 * 1024) return window.showToast('La foto debe pesar menos de 800KB para Firestore', 'error');
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                const base64 = ev.target.result;
                document.getElementById('w-photo-base64').value = base64;
                document.getElementById('w-photo-preview').src = base64;
                document.getElementById('w-photo-preview').classList.remove('hidden');
                document.getElementById('w-photo-icon').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        };

        window.saveWorker = async () => {
            const formId = document.getElementById('w-id').value;
            const btn = document.getElementById('save-worker-btn');
            
            const workerData = {
                id: formId || 'w_' + Date.now(),
                name: document.getElementById('w-name').value,
                document: document.getElementById('w-doc').value,
                phone: document.getElementById('w-phone').value,
                city: document.getElementById('w-city').value,
                role: document.getElementById('w-role').value,
                status: document.getElementById('w-status').value,
                availabilityText: document.getElementById('w-availability').value,
                specialties: document.getElementById('w-specs').value,
                photo: document.getElementById('w-photo-base64').value
            };

            if(!workerData.name || !workerData.document) return window.showToast('Nombre y documento requeridos', 'error');

            if (['ADMIN', 'HR'].includes(window.appState.currentUser.role)) {
                workerData.bankName = document.getElementById('w-bank-name').value;
                workerData.bankType = document.getElementById('w-bank-type').value;
                workerData.bankNumber = document.getElementById('w-bank-num').value;
                workerData.bankOwner = document.getElementById('w-bank-owner').value;
            } else if (formId) {
                const oldData = window.appState.dbWorkers.find(w => w.id === formId);
                if (oldData) {
                    workerData.bankName = oldData.bankName;
                    workerData.bankType = oldData.bankType;
                    workerData.bankNumber = oldData.bankNumber;
                    workerData.bankOwner = oldData.bankOwner;
                }
            }

            btn.disabled = true;
            btn.innerText = 'Guardando...';

            try {
                await setDoc(doc(db, "workers", workerData.id), workerData);
                const index = window.appState.dbWorkers.findIndex(w => w.id === workerData.id);
                if(index >= 0) window.appState.dbWorkers[index] = workerData;
                else window.appState.dbWorkers.push(workerData);

                if(window.appState.selectedWorker && window.appState.selectedWorker.id === formId) {
                    window.appState.selectedWorker = workerData;
                }

                window.closeWorkerModal();
                window.showToast('Trabajador guardado con éxito');
                
                if (window.appState.currentView === 'directory') window.setView('directory');
                if (window.appState.currentView === 'profile') window.setView('profile');
            } catch (error) {
                window.showToast('Error al guardar en Firebase', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Guardar';
            }
        };

        // UTILIDADES
        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text).then(() => {
                window.showToast('Copiado al portapapeles');
            });
        };

        window.showToast = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            const icon = document.getElementById('toast-icon');
            icon.className = type === 'success' ? 'fas fa-check-circle text-[#7be4af]' : 'fas fa-exclamation-circle text-red-400';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        };
    </script>
</body>
</html>
